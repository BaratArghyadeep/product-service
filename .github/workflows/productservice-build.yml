name: Build and Push ProductService

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.ACR_LOGIN_SERVER }}/productservice:latest \
        -f ProductService.API/Dockerfile .

    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.ACR_LOGIN_SERVER }}/productservice:latest
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

    - name: Update ProductService Deployment
      run: |
        kubectl set image deployment/productservice \
        productservice=ecommerceacrbarat.azurecr.io/productservice:latest \
        -n ecommerce

    - name: Verify Rollout
      run: |
        kubectl rollout status deployment/productservice \
        -n ecommerce